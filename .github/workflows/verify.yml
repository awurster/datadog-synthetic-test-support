name: ✅ Verify Build and Tests

on:
  push:
    branches: [ main, develop, 'feature/**', 'bugfix/**' ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly builds to catch integration issues early
    - cron: '0 2 * * *'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g -XX:MaxMetaspaceSize=768m

jobs:
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: 📝 Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: 🧹 Code Formatting Check
        run: ./gradlew ktlintCheck

      - name: 🔒 Security Scan
        run: ./gradlew dependencyCheckAnalyze

      - name: 📊 Generate Build Report
        run: ./gradlew build --scan

  test:
    name: 🧪 Tests (JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: 🧪 Run Unit Tests
        run: ./gradlew test

      - name: 🔬 Run Integration Tests
        run: ./gradlew integrationTest

      - name: 📊 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.java }}-${{ matrix.os }}
          path: |
            build/reports/tests/**
            build/test-results/**

      - name: 📈 Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always() && matrix.java == '17' && matrix.os == 'ubuntu-latest'
        with:
          files: build/test-results/**/*.xml

  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: 🏗️ Build Project
        run: ./gradlew build

      - name: 📦 Build JAR
        run: ./gradlew jar

      - name: 📚 Generate Documentation
        run: ./gradlew dokkaJavadoc

      - name: 🧪 E2E Tests
        run: ./gradlew e2eTest
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY_TEST }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY_TEST }}

      - name: 📤 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar
            build/javadoc/**
          retention-days: 30

  coverage:
    name: 📊 Code Coverage
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Gradle  
        uses: gradle/gradle-build-action@v3

      - name: 📊 Generate Coverage Report
        run: ./gradlew jacocoTestReport

      - name: 📤 Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: build/test-results/test/xml/jacocoReport.xml
          flags: unittests
          name: codecov-umbrella

  dependency-review:
    name: 🔍 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  performance:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf]')
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: ⚡ Run Performance Tests
        run: ./gradlew performanceTest

      - name: 📊 Performance Report
        run: ./gradlew performanceReport

  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [build, coverage]
    if: always()
    
    steps:
      - name: 📢 Slack Notification
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#build-notifications'
          username: 'Build Bot'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
