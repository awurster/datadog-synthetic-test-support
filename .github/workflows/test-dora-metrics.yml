name: 🧪 Test DORA Metrics Collection

on:
  push:
    branches: [ github-builds ]
  workflow_dispatch:
    # Allow manual triggering for testing

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Xmx2g -XX:MaxMetaspaceSize=768m

jobs:
  test-dora-metrics:
    name: 📈 Test DORA Metrics Collection
    runs-on: ubuntu-latest
    environment: env  # This will access the 'env' environment secrets
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: 📈 Execute DORA Metrics Collection
        run: |
          echo "Starting DORA metrics collection test..."
          ./gradlew collectDoraMetrics --no-daemon --info
        env:
          # Enterprise environment variables for comprehensive metrics collection
          BUILD_ENVIRONMENT: "github-actions"
          CI: "true"
          CI_PIPELINE_ID: ${{ github.run_id }}
          REPOSITORY_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DD_API_KEY: ${{ secrets.DD_API_KEY_TEST }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY_TEST }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          # Environment secrets (these will now be accessible)
          MY_REPO_SECRET: ${{ secrets.MY_REPO_SECRET }}
          A_VARIABLE: ${{ vars.A_VARIABLE }}
          ACTIONS_STEP_DEBUG: true
          # Additional test environment variables
          TEST_SECRET_KEY: "test-secret-value-123"
          DATABASE_URL: "postgresql://user:pass@localhost:5432/testdb"
          API_ENDPOINT: "https://api.example.com/v1"
          ENCRYPTION_KEY: "super-secret-encryption-key" 